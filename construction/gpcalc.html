<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP Calculator</title>
    <meta name="description" content="Gross Profit Calculator">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #166534, #052e16);
            color: #dcfce7;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 420px;
            margin: 30px auto;
            background: rgba(22, 101, 52, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #86efac; }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #86efac;
        }
        input {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            background: #052e16;
            color: #86efac;
            border: 2px solid #4ade80;
            border-radius: 12px;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            background: #4ade80;
            color: #166534;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            margin: 8px 0;
        }
        .reset-btn {
            background: #854d0e;
            color: white;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            font-size: 18px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 GP Calculator</h1>
        <p style="text-align:center;">Desired GP% + Cost → Sell Price</p>
        
        <div class="field">
            <label for="gpPercent">Desired GP %</label>
            <input type="number" id="gpPercent" placeholder="e.g. 30" step="0.1">
        </div>
        
        <div class="field">
            <label for="cost">Cost $</label>
            <input type="number" id="cost" placeholder="0.00" step="0.01">
        </div>
        
        <button onclick="calculateGP()">Calculate Sell Price</button>
        <button onclick="resetForm()" class="reset-btn">Reset</button>
        
        <div id="results" class="result" style="display:none;">
            <div class="row"><span>Final Sell Price</span><span id="sellPrice"></span></div>
            <div class="row"><span>Gross Profit $</span><span id="gpDollar"></span></div>
            <div class="row"><span>Markup %</span><span id="markup"></span></div>
            <div class="row"><span>Actual GP %</span><span id="actualGP"></span></div>
        </div>
    </div>

    <script>
        function calculateGP() {
            const cost = parseFloat(document.getElementById('cost').value) || 0;
            const desiredGP = parseFloat(document.getElementById('gpPercent').value) || 0;
            
            if (cost <= 0 || desiredGP <= 0) {
                alert("Please enter both Cost and Desired GP%");
                return;
            }
            if (desiredGP >= 100) {
                alert("Desired GP% must be less than 100");
                return;
            }
            
            const gpDecimal = desiredGP / 100;
            const sell = cost / (1 - gpDecimal);
            const gpDollar = sell - cost;
            const markup = (gpDollar / cost * 100);
            
            document.getElementById('sellPrice').textContent = '$' + sell.toFixed(2);
            document.getElementById('gpDollar').textContent = '$' + gpDollar.toFixed(2);
            document.getElementById('markup').textContent = markup.toFixed(1) + '%';
            document.getElementById('actualGP').textContent = desiredGP.toFixed(1) + '%';
            
            document.getElementById('results').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('gpPercent').value = '';
            document.getElementById('cost').value = '';
            document.getElementById('results').style.display = 'none';
        }

        // Enter key support
        document.getElementById('gpPercent').addEventListener('keypress', e => { if (e.key === 'Enter') calculateGP(); });
        document.getElementById('cost').addEventListener('keypress', e => { if (e.key === 'Enter') calculateGP(); });
    </script>

    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
